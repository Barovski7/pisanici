<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>klati.me — Admin</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}
.top{padding:20px 5%;border-bottom:1px solid #333;display:flex;justify-content:space-between}
.wrap{max-width:1100px;margin:auto;padding:35px 20px}
.form{display:grid;gap:12px;margin-bottom:50px}
input,textarea,select{background:#151515;border:1px solid #444;color:#fff;padding:13px;font:inherit}
textarea{min-height:300px;resize:vertical}
button{padding:12px 18px;border:0;background:#d9ff00;font-weight:700;cursor:pointer}
.danger{background:#ff3567}
.posts{display:grid;gap:12px}
.row{border:1px solid #333;padding:18px;display:flex;justify-content:space-between;gap:20px}
.muted{color:#888}
.actions{display:flex;gap:8px;align-items:center}
.cancel{background:#444;color:#fff}
</style>
</head>
<body>
<div class="top"><strong>KLATI.ME / ADMIN</strong><button onclick="logout()">Изход</button></div>
<main class="wrap">
<h1 id="formTitle">Нова писаница</h1>
<form class="form" id="form">
<input id="title" placeholder="Заглавие">
<input id="excerpt" placeholder="Кратко описание">
<input id="category" value="Писаници" placeholder="Категория">
<textarea id="body" placeholder="Пиши тук..."></textarea>
<select id="status">
<option value="draft">Чернова</option>
<option value="published">Публикувай</option>
</select>
<div style="display:flex;gap:12px">
<button id="saveBtn" type="submit">ЗАПАЗИ</button>
<button id="cancelBtn" type="button" class="cancel" style="display:none" onclick="cancelEdit()">ОТКАЗ</button>
</div>
</form>
<h2>Публикации</h2>
<div id="list" class="posts">Зареждане...</div>
</main>
<script>
const $=id=>document.getElementById(id);
let editId=null;
let editSlug='';

async function load(){
  let r=await fetch('/api/admin/posts');
  if(r.status===401){location.href='/admin';return}
  let a=await r.json();
  $('list').innerHTML=a.map(p=>`<div class="row"><div><strong>${esc(p.title)}</strong><div class="muted">${p.status} · ${p.published_at||'непубликувана'}</div></div><div class="actions"><button onclick="edit(${p.id})">Редактирай</button><button class="danger" onclick="del(${p.id})">Изтрий</button></div></div>`).join('')||'<div class="muted">Няма публикации.</div>';
}

$('form').onsubmit=async e=>{
  e.preventDefault();
  const b={
    title:$('title').value,
    excerpt:$('excerpt').value,
    category:$('category').value,
    body:$('body').value,
    status:$('status').value
  };

  let url='/api/admin/posts';
  let method='POST';

  if(editId!==null){
    url='/api/admin/posts/'+editId;
    method='PUT';
    b.slug=editSlug;
  }

  let r=await fetch(url,{
    method,
    headers:{'content-type':'application/json'},
    body:JSON.stringify(b)
  });

  if(!r.ok){
    let data=await r.json().catch(()=>({}));
    alert(data.error||'Грешка');
    return;
  }

  resetForm();
  await load();
};

async function del(id){
  if(!confirm('Да изтрием ли писаницата?'))return;
  const r=await fetch('/api/admin/posts/'+id,{method:'DELETE'});
  if(!r.ok){alert('Грешка при изтриването.');return}
  if(editId===id) resetForm();
  load();
}

async function edit(id){
  let r=await fetch('/api/admin/posts');
  if(!r.ok){alert('Не успяхме да заредим публикациите.');return}
  let p=(await r.json()).find(x=>x.id===id);
  if(!p)return;

  editId=p.id;
  editSlug=p.slug||'';
  $('formTitle').textContent='Редактиране на писаница';
  $('title').value=p.title||'';
  $('excerpt').value=p.excerpt||'';
  $('category').value=p.category||'Писаници';
  $('body').value=p.body||'';
  $('status').value=p.status||'draft';
  $('saveBtn').textContent='ЗАПАЗИ ПРОМЕНИТЕ';
  $('cancelBtn').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function cancelEdit(){resetForm()}

function resetForm(){
  editId=null;
  editSlug='';
  $('formTitle').textContent='Нова писаница';
  $('form').reset();
  $('category').value='Писаници';
  $('status').value='draft';
  $('saveBtn').textContent='ЗАПАЗИ';
  $('cancelBtn').style.display='none';
}

async function logout(){
  await fetch('/api/admin/logout',{method:'POST'});
  location.href='/admin';
}

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

load();
</script>
</body>
</html>
