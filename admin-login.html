<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>klati.me — admin</title><style>body{margin:0;background:#090909;color:#fff;font-family:Arial;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,90vw);border:1px solid #333;padding:35px}.logo{font:44px Georgia;margin-bottom:30px}input,button{width:100%;padding:14px;margin-top:12px;box-sizing:border-box}button{background:#d9ff00;border:0;font-weight:700;cursor:pointer}.err{color:#ff3567;margin-top:15px}</style></head><body><div class="box"><div class="logo">klati.me</div><h2>Админ вход</h2><input id="pw" type="password" placeholder="Парола"><button onclick="login()">ВЛЕЗ</button><div id="e" class="err"></div></div><script>async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});if(r.ok)location.href='/admin';else document.getElementById('e').textContent=(await r.json()).error||'Грешка';}</script></body></html>
